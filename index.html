<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
/* ===== Body and fonts ===== */
body {
  margin:0;
  padding:0;
  font-family: 'Comic Sans MS', cursive;
  overflow:hidden;
  background: #ffe4e1; /* soft light pink */
  text-align:center;
}

/* YES / NO buttons */
button {
  padding:12px 25px;
  font-size:20px;
  border:none;
  border-radius:20px;
  margin:20px;
  cursor:pointer;
  font-weight:bold;
  text-shadow:1px 1px #fff;
}

#yes{
  background:#ff4d6d;
  color:white;
}

#no{
  background:white;
  position:absolute;
  color:#ff3366;
  font-weight:bold;
  text-shadow:1px 1px #ff9999;
}

/* Floating hearts from start */
.startHeart{
  position:absolute;
  font-size:20px;
  animation:float 5s linear infinite;
}

@keyframes float{
  0% {transform: translateY(0) translateX(0);}
  50% {transform: translateY(-20px) translateX(10px);}
  100% {transform: translateY(0) translateX(0);}
}

/* Fullscreen result container */
#result{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:10;
}

/* Fullscreen background photo */
#result::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-image: url('love.jpg');
  background-size: cover;
  background-position: center;
  filter: brightness(0.8);
  z-index:-1;
}

/* Glittering text in center */
#loveText{
  position:absolute;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  color:white;
  font-size:32px;
  font-weight:bold;
  text-shadow: 2px 2px #ff6699;
  animation: glitter 1s infinite;
  line-height:1.5;
}

/* Glitter effect */
@keyframes glitter {
  0% {color: #ffffff;}
  25% {color: #ff99cc;}
  50% {color: #ff3366;}
  75% {color: #ffe6f0;}
  100% {color: #ffffff;}
}

/* Hearts falling after YES */
.heart{
  position:absolute;
  font-size:20px;
  color:red;
  animation:fall 3s linear infinite;
}

@keyframes fall{
  0% {transform: translateY(-50px);}
  100% {transform: translateY(100vh);}
}

/* Confetti */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background-color: #ff3366;
  opacity: 0.8;
  animation: confettiFall linear infinite;
}

@keyframes confettiFall {
  0% {transform: translateY(-10px) rotate(0deg);}
  100% {transform: translateY(100vh) rotate(360deg);}
}
</style>
</head>

<body>

<!-- Starting text and buttons -->
<h1 id="questionText">Hey my love 😘… will you be my forever partner? 💖</h1>

<button id="yes" onclick="yesClick()">YES ❤️</button>
<button id="no" onmouseover="moveNo()">NO 😢</button>

<!-- Result container -->
<div id="result">
  <div id="loveText">
    Happy Valentine’s Day Love 😘<br>
    I love you forever ❤️
  </div>
</div>

<script>
/* NO button texts */
const noTexts=[
"No?? really? 🥺",
"Please reconsider 💔",
"Free hugs daily 🤗",
"Try clicking YES 😌",
"Wrong button sweetheart 😜",
"The YES button is cuter 💞",
"You can't escape destiny 😏",
"Last chance… promise 😇"
];

/* NO button moves */
function moveNo(){
  let btn=document.getElementById("no");
  let x=Math.random()*(window.innerWidth-100);
  let y=Math.random()*(window.innerHeight-100);
  btn.style.left=x+"px";
  btn.style.top=y+"px";
  btn.innerHTML=noTexts[Math.floor(Math.random()*noTexts.length)];
}

/* YES button click */
function yesClick(){
  // Hide question and buttons
  document.getElementById("yes").style.display="none";
  document.getElementById("no").style.display="none";
  document.getElementById("questionText").style.display="none";
  
  // Show result
  document.getElementById("result").style.display="block";

  // Hearts raining
  for(let i=0;i<50;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.style.left=Math.random()*window.innerWidth+"px";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.innerHTML="❤️";
    heart.style.animationDuration=(2+Math.random()*3)+"s";
    document.body.appendChild(heart);
  }

  // Confetti
  for(let i=0;i<50;i++){
    let conf=document.createElement("div");
    conf.className="confetti";
    conf.style.left=Math.random()*window.innerWidth+"px";
    conf.style.backgroundColor=["#ff3366","#ff6699","#ff99cc","#ffe6f0"][Math.floor(Math.random()*4)];
    conf.style.width=(5+Math.random()*8)+"px";
    conf.style.height=(5+Math.random()*8)+"px";
    conf.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(conf);
  }

  // Optional: small floating hearts
  for(let i=0;i<20;i++){
    let fHeart=document.createElement("div");
    fHeart.className="startHeart";
    fHeart.style.left=Math.random()*window.innerWidth+"px";
    fHeart.style.fontSize=(15+Math.random()*25)+"px";
    fHeart.innerHTML="💖";
    document.body.appendChild(fHeart);
  }
}

/* Floating hearts at start */
for(let i=0;i<30;i++){
  let fHeart=document.createElement("div");
  fHeart.className="startHeart";
  fHeart.style.left=Math.random()*window.innerWidth+"px";
  fHeart.style.fontSize=(15+Math.random()*25)+"px";
  fHeart.innerHTML="💖";
  document.body.appendChild(fHeart);
}
</script>

</body>
</html>
