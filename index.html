<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine Surprise ❤️</title>
<style>
/* ===== General Styles ===== */
body {
  margin:0;
  padding:0;
  font-family: 'Comic Sans MS', cursive;
  overflow:hidden;
  text-align:center;
  background: linear-gradient(135deg,#ffe4e1,#ffd6e8);
}

/* Center content for pages */
.page {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* ===== First Page ===== */
#firstPage h1 {
  font-size:32px;
  color:#ff3366;
  text-shadow:2px 2px #fff;
  margin-bottom:30px;
}

#envelope {
  font-size:80px;
  cursor:pointer;
  transition: transform 0.3s;
}

#envelope:hover {
  transform: scale(1.2) rotate(-5deg);
}

/* ===== Second Page ===== */
#secondPage {
  display:none;
  flex-direction:column;
  background: linear-gradient(135deg,#ffe4e1,#ffccd9);
  color:#ff3366;
}

#secondPage h1 {
  font-size:28px;
  margin-bottom:20px;
  text-shadow:1px 1px #fff;
}

#hint {
  font-size:16px;
  color:#ff99cc;
  margin-bottom:10px;
}

/* Buttons */
button {
  padding:12px 25px;
  font-size:20px;
  border:none;
  border-radius:20px;
  margin:15px;
  cursor:pointer;
  font-weight:bold;
  text-shadow:1px 1px #fff;
}

#yesBtn { background:#ff4d6d; color:white; }
#noBtn { background:white; color:#ff3366; position:absolute; }

/* ===== Third Page ===== */
#thirdPage {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  overflow:hidden;
  z-index:10;
}

#thirdPage::before {
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background-image: url('love.jpg');
  background-size:cover;
  background-position:center;
  filter: brightness(0.8);
  z-index:-1;
}

#loveText {
  position:absolute;
  top:50%; left:-100%;
  transform:translateY(-50%);
  font-size:36px;
  font-weight:bold;
  text-align:center;
  white-space: nowrap;
  animation: slideText 10s linear infinite;
}

#loveText span:first-child { color:#ffd6e8; }
#loveText span:last-child { display:block; color:#ffb6c1; font-size:30px; }

@keyframes slideText{
  0% {left:-100%;}
  50% {left:50%;}
  100% {left:110%;}
}

/* ===== Hearts & Confetti ===== */
.heart, .startHeart{
  position:absolute;
  font-size:20px;
  animation:fall 5s linear infinite;
}

@keyframes fall{
  0% {transform: translateY(-50px);}
  100% {transform: translateY(100vh);}
}

.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius:50%;
  opacity: 0.9;
  animation: confettiFall linear infinite;
}

@keyframes confettiFall {
  0% {transform: translateY(-10px) rotate(0deg);}
  100% {transform: translateY(100vh) rotate(360deg);}
}
</style>
</head>
<body>

<!-- First Page -->
<div id="firstPage" class="page">
  <h1>Hey Love!<br>I have something to ask you 💌</h1>
  <div id="envelope" onclick="openEnvelope()">💌</div>
</div>

<!-- Second Page -->
<div id="secondPage" class="page">
  <h1>Will you be my Valentine for a lifetime? ❤️</h1>
  <div id="hint">Try clicking NO 😉</div>
  <button id="yesBtn" onclick="yesClick()">YES ❤️</button>
  <button id="noBtn" onmouseover="moveNo()">NO 😢</button>
</div>

<!-- Third Page -->
<div id="thirdPage">
  <div id="loveText">
    <span>Happy Valentine’s Day Love 😘</span>
    <span>I love you forever ❤️</span>
  </div>
</div>

<script>
/* ===== First Page ===== */
function openEnvelope(){
  document.getElementById("firstPage").style.display="none";
  document.getElementById("secondPage").style.display="flex";
  createFloatingHearts(50,'#ff6699,#ff99cc,#ffb6c1,#ffc0cb');
}

/* ===== Second Page ===== */
const noTexts=[
"No?? really? 🥺",
"Please reconsider 💔",
"I brought chocolates 🍫",
"I will share my fries 🍟",
"I'll do the dishes forever 😭",
"Free hugs daily 🤗",
"Try clicking YES 😌",
"The YES button is cuter 💞",
"You can't escape destiny 😏",
"Pretty please 😘"
];

function moveNo(){
  let btn=document.getElementById("noBtn");
  let x=Math.random()*(window.innerWidth-100);
  let y=Math.random()*(window.innerHeight-100);
  btn.style.left=x+"px";
  btn.style.top=y+"px";
  btn.innerHTML=noTexts[Math.floor(Math.random()*noTexts.length)];
}

/* YES Click -> Final Romantic Page */
function yesClick(){
  document.getElementById("secondPage").style.display="none";
  document.getElementById("thirdPage").style.display="block";

  // Continuous hearts
  setInterval(()=>{
    let heart=document.createElement("div");
    heart.className="heart";
    heart.style.left=Math.random()*window.innerWidth+"px";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.innerHTML="💖";
    heart.style.animationDuration=(4+Math.random()*3)+"s";
    document.body.appendChild(heart);
  },300);

  // Continuous confetti
  setInterval(()=>{
    let conf=document.createElement("div");
    conf.className="confetti";
    conf.style.left=Math.random()*window.innerWidth+"px";
    conf.style.backgroundColor=["#ff3366","#ff6699","#ff99cc","#ffe6f0"][Math.floor(Math.random()*4)];
    conf.style.width=(5+Math.random()*8)+"px";
    conf.style.height=(5+Math.random()*8)+"px";
    conf.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(conf);
  },200);
}

/* Floating hearts for first page */
function createFloatingHearts(num,colors){
  let colorArray = colors.split(',');
  for(let i=0;i<num;i++){
    let fHeart=document.createElement("div");
    fHeart.className="startHeart";
    fHeart.style.left=Math.random()*window.innerWidth+"px";
    fHeart.style.fontSize=(10+Math.random()*25)+"px";
    fHeart.style.color=colorArray[Math.floor(Math.random()*colorArray.length)];
    fHeart.innerHTML="💖";
    document.body.appendChild(fHeart);
  }
}
</script>
</body>
</html>
