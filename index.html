<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise ❤️</title>
<style>
/* General body setup */
body {
  margin:0; padding:0;
  font-family: 'Comic Sans MS', cursive;
  overflow:hidden;
  text-align:center;
  background: linear-gradient(135deg,#ffe4e1,#ffd6e8);
}
.page {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* ===== First Page ===== */
#firstPage h1 {
  font-size:32px;
  color:#ff3366;
  text-shadow:2px 2px #fff;
  margin-bottom:30px;
}
#envelope {
  font-size:60px;
  width:100px; height:100px;
  background:#ffccd9;
  border-radius:15px;
  display:flex; justify-content:center; align-items:center;
  cursor:pointer;
  box-shadow:0px 5px 10px rgba(0,0,0,0.2);
  transition: transform 0.3s, box-shadow 0.3s;
}
#envelope:hover {
  transform: scale(1.2) rotate(-5deg);
  box-shadow:0px 8px 15px rgba(0,0,0,0.3);
}

/* Floating hearts first page */
.startHeart {
  position:absolute;
  font-size:20px;
  animation:float 6s linear infinite;
  opacity:0.7;
}
@keyframes float {
  0% {transform: translateY(0) translateX(0);}
  50% {transform: translateY(-20px) translateX(10px);}
  100% {transform: translateY(0) translateX(0);}
}

/* ===== Second Page ===== */
#secondPage {
  display:none;
  flex-direction:column;
  background: linear-gradient(135deg,#ffe4e1,#ffccd9);
  color:#ff3366;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
#secondPage h1 {
  font-size:28px;
  margin-bottom:20px;
  text-shadow:1px 1px #fff;
  padding:0 10px;
}
#hint {
  font-size:16px;
  color:#ff99cc;
  margin-bottom:10px;
}
#buttonContainer {
  display:flex; gap:20px; justify-content:center; position:relative;
}
button {
  padding:12px 25px;
  font-size:20px;
  border:none;
  border-radius:20px;
  margin:10px;
  cursor:pointer;
  font-weight:bold;
  text-shadow:1px 1px #fff;
}
#yesBtn { background:#ff4d6d; color:white; }
#noBtn { background:white; color:#ff3366; position:relative; }

/* ===== Third Page ===== */
#thirdPage {
  display:none;
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  overflow:hidden;
  z-index:10;
}
#thirdPage::before {
  content:"";
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  background-image: url('love.jpg'); /* Replace with your photo file name */
  background-size:cover;
  background-position:center;
  filter: brightness(0.85);
  z-index:-1;
}
/* Texts in third page */
#loveText {
  position:absolute;
  top:60%; /* slightly below center */
  left:-100%;
  transform:translateY(-50%);
  font-size:36px; font-weight:bold;
  white-space: nowrap;
  animation:slideIn 3s forwards;
  text-align:center;
}
#loveText span:first-child{
  font-family: 'Pacifico', cursive;
  color:#ffd6e8;
}
#loveText span:last-child{
  display:block;
  font-family: 'Dancing Script', cursive;
  font-size:36px;
  color:#ffb6c1;
  text-shadow:0 0 10px #ffb6c1,0 0 20px #ff99cc,0 0 30px #ff6699;
  animation:glow 2s infinite alternate;
}

/* Text animation */
@keyframes slideIn{
  0% {left:-100%;}
  100% {left:50%; transform:translateX(-50%) translateY(-50%);}
}
@keyframes glow{
  0% {text-shadow: 0 0 5px #ffb6c1,0 0 10px #ff99cc,0 0 15px #ff6699;}
  100% {text-shadow: 0 0 20px #ffb6c1,0 0 40px #ff99cc,0 0 60px #ff6699;}
}

/* Hearts and confetti for third page */
.heart, .confetti { position:absolute; z-index:5; }
.heart{ font-size:20px; animation:fall 6s linear infinite; }
.confetti{ width:8px; height:8px; border-radius:50%; opacity:0.9; animation:confettiFall linear infinite; }
@keyframes fall{0%{transform:translateY(-50px);}100%{transform:translateY(100vh);}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);}100%{transform:translateY(100vh) rotate(360deg);}}
</style>
</head>
<body>

<!-- First Page -->
<div id="firstPage" class="page">
  <h1>Hey Love!<br>I have something to ask you 💌</h1>
  <div id="envelope" onclick="openEnvelope()">💌</div>
</div>

<!-- Second Page -->
<div id="secondPage" class="page">
  <h1>Will you be my Valentine for a lifetime? ❤️</h1>
  <div id="hint">Try pressing NO if you dare 😉</div>
  <div id="buttonContainer">
    <button id="yesBtn" onclick="yesClick()">YES ❤️</button>
    <button id="noBtn" onmouseover="moveNo()">NO 😢</button>
  </div>
</div>

<!-- Third Page -->
<div id="thirdPage">
  <div id="loveText">
    <span>Happy Valentine’s Day Love 😘</span>
    <span>I love you forever ❤️</span>
  </div>
</div>

<script>
/* Cute NO texts */
const noTexts=[
"No?? really? 🥺",
"Please reconsider 💔",
"Free hugs daily 🤗",
"Try clicking YES 😌",
"The YES button is cuter 💞",
"You can't escape destiny 😏",
"Pretty please 😘",
"Wrong button sweetheart 😜",
];

/* Open envelope from first page */
function openEnvelope(){
  document.getElementById("firstPage").style.display="none";
  document.getElementById("secondPage").style.display="flex";
}

/* NO hover - stays visible and moves randomly */
function moveNo(){
  let btn = document.getElementById("noBtn");
  
  // Ensure button stays fully on screen
  let btnWidth = btn.offsetWidth;
  let btnHeight = btn.offsetHeight;
  let maxX = window.innerWidth - btnWidth - 10; 
  let maxY = window.innerHeight - btnHeight - 10;
  
  let x = Math.random() * maxX;
  let y = Math.random() * maxY;
  
  btn.style.position = "absolute";
  btn.style.left = x + "px";
  btn.style.top = y + "px";
  
  // Change text each move
  btn.innerHTML = noTexts[Math.floor(Math.random() * noTexts.length)];
}

/* YES Click - show photo page */
function yesClick(){
  document.getElementById("secondPage").style.display="none";
  document.getElementById("thirdPage").style.display="block";

  // Continuous hearts
  setInterval(()=>{
    let heart = document.createElement("div");
    heart.className="heart";
    heart.style.left=Math.random()*window.innerWidth+"px";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.innerHTML="💖";
    heart.style.animationDuration=(4+Math.random()*3)+"s";
    document.body.appendChild(heart);
  },300);

  // Continuous confetti
  setInterval(()=>{
    let conf = document.createElement("div");
    conf.className="confetti";
    conf.style.left=Math.random()*window.innerWidth+"px";
    conf.style.backgroundColor=["#ff3366","#ff6699","#ff99cc","#ffe6f0"][Math.floor(Math.random()*4)];
    conf.style.width=(5+Math.random()*8)+"px";
    conf.style.height=(5+Math.random()*8)+"px";
    conf.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(conf);
  },200);
}
</script>
</body>
</html>
