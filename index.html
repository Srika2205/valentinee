<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise ❤️</title>

<style>
body{
margin:0;
font-family:'Comic Sans MS', cursive;
overflow:hidden;
background:linear-gradient(135deg,#ffe4e1,#ffd6ea);
}

/* pages */
.page{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

/* FIRST PAGE */
#envelope{
font-size:70px;
background:#fff0f5;
padding:25px 35px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,.2);
cursor:pointer;
transition:.3s;
}
#envelope:hover{transform:scale(1.1) rotate(-5deg);}

/* SECOND PAGE */
#secondPage{display:none;}

#questionBox{
width:90%;
max-width:420px;
height:420px;
background:#fff0f8;
border-radius:30px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
position:relative;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

#questionBox h2{
color:#ff4d88;
text-align:center;
padding:0 15px;
}

#hint{color:#ff7aa8;font-size:14px;margin-top:8px}

/* cute boxes */
.choice{
position:absolute;
padding:14px 26px;
border-radius:40px;
background:white;
box-shadow:0 6px 15px rgba(0,0,0,.15);
cursor:pointer;
user-select:none;
transition:.25s;
}

/* YES */
#yes{
background:linear-gradient(45deg,#ff5c8a,#ff9ab5);
color:white;
left:30%;
top:70%;
}

/* NO */
#no{
background:#fff;
color:#ff5c8a;
border:2px solid #ff9ab5;
left:60%;
top:70%;
}

/* THIRD PAGE */
#thirdPage{
display:none;
position:absolute;
width:100%;
height:100%;
overflow:hidden;
}
#thirdPage::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:url('love.jpg') center/cover no-repeat;
filter:brightness(.85);
z-index:-1;
}

/* text */
#loveText{
  position:absolute;
  top:68%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
}

/* Every line separate */
#loveText span{
  display:block;
  margin:8px 0;
  opacity:0;
  animation:fadeIn 1s forwards;
}

/* glowing FOREVER line */
.line3{
  font-size:36px;
  font-family:'Pacifico', cursive;
  color:#fff0f8;
  animation:fadeIn 1s forwards, glow 2s infinite alternate;
  animation-delay:3.5s,3.5s;
}

/* small cute hug line */
.line4{
  font-size:20px;
  color:#fff;
  font-style:italic;
  animation-delay:5s;
}


/* Different romantic styles */
.line1{
  font-size:34px;
  color:#ffe4f2;
  animation-delay:0.5s;
}

.line2{
  font-size:34px;
  color:#ffd1ea;
  animation-delay:2s;
}

.line3{
  font-size:36px;
  font-family:'Pacifico', cursive;
  color:#fff0f8;
  text-shadow:0 0 10px #ff9acb;
  animation-delay:3.5s;
}

.line4{
  font-size:36px;
  color:#ffc0e1;
  text-shadow:0 0 15px #ff85c2,0 0 35px #ff5ca8;
  animation:glow 2s infinite alternate;
  animation-delay:5s;
}

.line5{
  font-size:22px; /* smaller cute whisper text */
  color:#fff;
  animation-delay:6.5s;
}

/* Fade appear one by one */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

/* glow effect */
@keyframes glow{
  from{text-shadow:0 0 10px #ffc0e1;}
  to{text-shadow:0 0 40px #ff5ca8;}
}


/* falling hearts */
.heart{
position:fixed;
top:-20px;
pointer-events:none;
animation:fall linear forwards;
}

/* confetti */
.confetti{
position:fixed;
top:-10px;
width:8px;
height:14px;
border-radius:3px;
pointer-events:none;
animation:fall linear forwards;
}

/* falling animation */
@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
opacity:0.9;
}
}

</style>

<body>

<!-- FIRST PAGE -->
<div class="page" id="firstPage">
<h1 style="color:#ff4d88">Hey Love! 💌<br>I have something to ask you</h1>
<div id="envelope" onclick="openLetter()">Open</div>
</div>

<!-- SECOND PAGE -->
<div class="page" id="secondPage">
<div id="questionBox">
<h2> My Dear Husband! Will you be my Valentine for lifetime? ❤️</h2>
<div id="hint"> I already know the answer, but I still want to hear it.😉</div>

<div id="yes" class="choice" onclick="sayYes()">YES 💖</div>
<div id="no" class="choice">No 🥺</div>

</div>
</div>

<!-- THIRD PAGE -->
<div id="thirdPage">
<div id="loveText">
  <span class="line1">Yay! I knew you'd say yes❤️</span>
  <span class="line2">You just made me the happiest person ever!😘</span>
  <span class="line3">I love you forever ❤️</span>
  <span class="line4">Now come here and give me hug😉</span>
</div>

<script>
const noTexts=[
"Are you sure? 🥺","Think again 💞",
"Please reconsider 💔",
"Free hugs forever 🤗",
"You can't escape destiny 😏",
"The YES button is cuter 💞",
"Wrong button sweetheart 😜",
"Press YES instead 😘","Last chance 😭","Pretty please 💗"
];

/* open envelope */
function openLetter(){
document.getElementById("firstPage").style.display="none";
document.getElementById("secondPage").style.display="flex";
}

/* MOVE NO INSIDE BOX */
const no=document.getElementById("no");
const box=document.getElementById("questionBox");

function moveNo(){
const boxRect=box.getBoundingClientRect();
const btnRect=no.getBoundingClientRect();

let maxX=boxRect.width-btnRect.width-20;
let maxY=boxRect.height-btnRect.height-20;

let x=Math.random()*maxX;
let y=Math.random()*maxY;

no.style.left=x+"px";
no.style.top=y+"px";
no.innerHTML=noTexts[Math.floor(Math.random()*noTexts.length)];
}

no.addEventListener("mouseenter",moveNo);
no.addEventListener("touchstart",moveNo);

function sayYes(){
document.getElementById("secondPage").style.display="none";
document.getElementById("thirdPage").style.display="block";

/* start effects */
startRain();
}

/* continuous hearts & confetti */
function startRain(){

setInterval(()=>{
  createHeart();
  createConfetti();
},220);

}

function createHeart(){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(18+Math.random()*20)+"px";
h.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(h);

setTimeout(()=>h.remove(),8000);
}

function createConfetti(){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff5c8a","#ff9ab5","#ffd6ea","#ffc0d6","#ffffff"][Math.floor(Math.random()*5)];
c.style.animationDuration=(3+Math.random()*3)+"s";
document.body.appendChild(c);

setTimeout(()=>c.remove(),7000);
}

</script>

</body>
</html>
